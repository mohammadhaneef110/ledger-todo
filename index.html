<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2A41">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Ledger — Task Dashboard</title>
<style>
  :root{
    --ink:#1B2A41;
    --ink-soft:#48607D;
    --paper:#F1F5FA;
    --paper-dim:#E3EBF3;
    --line:#CCDBEA;
    --gold:#B8892B;
    --gold-soft:#EFE0BC;
    --sage:#3C7A8C;
    --sage-soft:#DCEAEF;
    --coral:#C4553F;
    --coral-soft:#F3DDD6;
    --white:#FFFFFF;
    --radius-s:4px;
    --radius-m:8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:var(--font);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- AUTH SCREEN ---------- */
  .auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-box{
    width:100%;
    max-width:360px;
  }
  .auth-brand{
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin-bottom:4px;
    text-align:center;
  }
  .auth-tag{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:32px;
  }
  .auth-field{
    margin-bottom:14px;
  }
  .auth-field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:600;
  }
  .auth-field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    background:var(--white);
    font-size:15px;
    font-family:var(--font);
    color:var(--ink);
  }
  .auth-field input:focus{
    outline:none;
    border-color:var(--ink);
  }
  .password-wrap{
    position:relative;
  }
  .password-wrap input{
    padding-right:44px;
  }
  .toggle-pw{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
  }
  .toggle-pw:hover{ color:var(--ink); }
  .auth-submit{
    width:100%;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius-s);
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  .auth-submit:disabled{ opacity:0.5; cursor:default; }
  .auth-switch{
    text-align:center;
    margin-top:18px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .auth-switch button{
    background:none;
    border:none;
    color:var(--ink);
    font-weight:700;
    cursor:pointer;
    font-size:13.5px;
    text-decoration:underline;
  }
  .auth-error{
    background:var(--coral-soft);
    color:var(--coral);
    padding:10px 12px;
    border-radius:var(--radius-s);
    font-size:13px;
    margin-bottom:14px;
    display:none;
  }
  .auth-error.show{ display:block; }
  .auth-loading{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding-top:80px;
  }

  /* ---------- APP LAYOUT ---------- */
  .app{
    display:none;
    min-height:100vh;
    max-width:1200px;
    margin:0 auto;
  }
  .app.show{ display:flex; }

  .sidebar{
    width:230px;
    flex-shrink:0;
    padding:32px 20px;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }

  .brand{
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin-bottom:4px;
  }
  .brand-tag{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:34px;
  }

  .nav-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    border-radius:var(--radius-s);
    font-size:14.5px;
    color:var(--ink-soft);
    cursor:pointer;
    margin-bottom:2px;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item:hover{ background:var(--paper-dim); color:var(--ink); }
  .nav-item.active{ background:var(--ink); color:var(--paper); font-weight:600; }
  .nav-count{
    font-size:12px;
    opacity:0.65;
  }

  .sidebar-divider{
    height:1px;
    background:var(--line);
    margin:22px 0;
  }

  .sync-box{
    padding:12px 14px;
    background:var(--paper-dim);
    border-radius:var(--radius-m);
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .sync-dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--sage);
    margin-right:6px;
  }
  .sync-dot.offline{ background:var(--gold); }

  .streak-box{
    margin-top:auto;
    padding:16px 14px;
    background:var(--ink);
    border-radius:var(--radius-m);
    color:var(--paper);
  }
  .streak-num{
    font-size:28px;
    font-weight:700;
    line-height:1;
  }
  .streak-label{
    font-size:12px;
    opacity:0.7;
    margin-top:6px;
  }
  .logout-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:8px 14px;
    border-radius:var(--radius-s);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .logout-btn:hover{ background:var(--paper-dim); color:var(--ink); }
  .install-btn{
    background:var(--ink);
    color:var(--paper);
    border:1px solid var(--ink);
  }
  .install-btn:hover{ opacity:0.85; background:var(--ink); color:var(--paper); }

  .main{
    flex:1;
    padding:36px 40px 60px;
    min-width:0;
  }

  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:16px;
  }

  .view-title{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .view-date{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .stat-strip{
    display:flex;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    margin-bottom:30px;
  }
  .stat{
    flex:1;
    padding:16px 20px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{ border-right:none; }
  .stat-num{
    font-size:24px;
    font-weight:700;
  }
  .stat-label{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .stat.accent .stat-num{ color:var(--coral); }
  .stat.good .stat-num{ color:var(--sage); }

  .add-bar{
    display:flex;
    gap:10px;
    margin-bottom:30px;
    flex-wrap:wrap;
  }
  .add-bar input[type=text]{
    flex:1;
    min-width:180px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    background:var(--white);
    font-size:14.5px;
    font-family:var(--font);
    color:var(--ink);
  }
  .add-bar input[type=text]:focus{
    outline:none;
    border-color:var(--ink);
  }
  .add-bar select, .add-bar input[type=date]{
    padding:12px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    background:var(--white);
    font-size:13.5px;
    font-family:var(--font);
    color:var(--ink-soft);
  }
  .add-btn{
    padding:12px 20px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius-s);
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .add-btn:hover{ opacity:0.85; }

  .group-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin:22px 0 10px;
  }
  .group-label:first-of-type{ margin-top:0; }

  .task-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
  }

  .task{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:var(--white);
    transition:background .15s ease;
  }
  .task:hover{ background:var(--paper-dim); }

  .check{
    width:19px;
    height:19px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .15s ease;
  }
  .check.done{
    background:var(--sage);
    border-color:var(--sage);
  }
  .check.done::after{
    content:"✓";
    color:var(--white);
    font-size:11px;
    font-weight:700;
  }

  .task-body{ flex:1; min-width:0; }
  .task-title{
    font-size:14.5px;
    color:var(--ink);
    word-break:break-word;
  }
  .task-title.done{
    text-decoration:line-through;
    color:var(--ink-soft);
    opacity:0.6;
  }
  .task-meta{
    display:flex;
    gap:10px;
    margin-top:4px;
    font-size:12px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }

  .pill{
    padding:2px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
  }
  .pill.high{ background:var(--coral-soft); color:var(--coral); }
  .pill.med{ background:var(--gold-soft); color:var(--gold); }
  .pill.low{ background:var(--sage-soft); color:var(--sage); }

  .due-overdue{ color:var(--coral); font-weight:600; }

  .del-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:18px;
    cursor:pointer;
    padding:4px 8px;
    opacity:0;
    transition:opacity .15s ease;
    flex-shrink:0;
  }
  .task:hover .del-btn{ opacity:0.6; }
  .del-btn:hover{ opacity:1 !important; color:var(--coral); }

  .empty-state{
    padding:50px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty-state-title{
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .progress-text{
    font-size:13px;
    color:var(--ink-soft);
  }

  @media (max-width: 760px){
    .app{ flex-direction:column; }
    .sidebar{
      width:100%;
      border-right:none;
      border-bottom:1px solid var(--line);
      flex-direction:row;
      align-items:center;
      padding:16px 20px;
      overflow-x:auto;
      gap:6px;
    }
    .brand, .brand-tag, .sidebar-divider, .streak-box, .sync-box{ display:none; }
    .nav-item{ white-space:nowrap; margin-bottom:0; }
    .main{ padding:24px 18px 50px; }
    .stat-strip{ flex-wrap:wrap; }
    .stat{ flex:1 1 45%; border-bottom:1px solid var(--line); }
  }

  :focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-box">
    <div class="auth-brand">Ledger</div>
    <div class="auth-tag" id="auth-tag">Sign in to sync your tasks everywhere</div>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="auth-password" autocomplete="current-password">
        <button type="button" class="toggle-pw" id="toggle-pw">Show</button>
      </div>
    </div>
    <button class="auth-submit" id="auth-submit">Sign in</button>
    <div class="auth-switch">
      <span id="auth-switch-text">Don't have an account?</span>
      <button id="auth-switch-btn">Create one</button>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="auth-loading" id="auth-loading">Loading…</div>

<!-- APP -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="brand">Ledger</div>
    <div class="brand-tag">Your day, accounted for</div>

    <div class="nav-item active" data-view="today">
      <span>Today</span><span class="nav-count" id="count-today">0</span>
    </div>
    <div class="nav-item" data-view="upcoming">
      <span>Upcoming</span><span class="nav-count" id="count-upcoming">0</span>
    </div>
    <div class="nav-item" data-view="all">
      <span>All tasks</span><span class="nav-count" id="count-all">0</span>
    </div>
    <div class="nav-item" data-view="completed">
      <span>Completed</span><span class="nav-count" id="count-completed">0</span>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sync-box" id="sync-box"><span class="sync-dot"></span>Synced</div>

    <div class="streak-box">
      <div class="streak-num" id="streak-num">0</div>
      <div class="streak-label">tasks completed today</div>
    </div>
  </div>

  <div class="main">
    <div class="top-row">
      <div>
        <div class="view-title" id="view-title">Today</div>
        <div class="view-date" id="view-date"></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-text" id="progress-text">0 of 0 done</div>
        <button class="logout-btn install-btn" id="install-btn" style="display:none;">Install app</button>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </div>

    <div class="stat-strip">
      <div class="stat">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Total tasks</div>
      </div>
      <div class="stat accent">
        <div class="stat-num" id="stat-overdue">0</div>
        <div class="stat-label">Overdue</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat good">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <div class="add-bar">
      <input type="text" id="input-title" placeholder="Add a task — e.g. Send invoice to client">
      <select id="input-priority">
        <option value="med">Medium priority</option>
        <option value="high">High priority</option>
        <option value="low">Low priority</option>
      </select>
      <input type="date" id="input-date">
      <button class="add-btn" id="add-btn">Add task</button>
    </div>

    <div id="task-container"></div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // ============================================================
  // PASTE YOUR FIREBASE CONFIG HERE (from Firebase Console)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCpsTgeqEf0AMgsmK8RQob1dgnSd-oZ2qA",
    authDomain: "ledger-app-6f5cf.firebaseapp.com",
    projectId: "ledger-app-6f5cf",
    storageBucket: "ledger-app-6f5cf.firebasestorage.app",
    messagingSenderId: "351885850364",
    appId: "1:351885850364:web:8fa6e982a6f228e428c979"
  };
  // ============================================================

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  db.enablePersistence({ synchronizeTabs: true }).catch(function(err){
    console.warn('Offline persistence not enabled:', err.code);
  });
</script>

<script>
(function(){
  let tasks = [];
  let currentView = 'today';
  let loaded = false;
  let currentUser = null;
  let unsubscribe = null;
  let isSignupMode = false;

  const $ = (id) => document.getElementById(id);
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  };

  // ---------------- AUTH ----------------
  function showAuthError(msg){
    const el = $('auth-error');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideAuthError(){
    $('auth-error').classList.remove('show');
  }

  $('toggle-pw').addEventListener('click', () => {
    const pwInput = $('auth-password');
    const btn = $('toggle-pw');
    if(pwInput.type === 'password'){
      pwInput.type = 'text';
      btn.textContent = 'Hide';
    } else {
      pwInput.type = 'password';
      btn.textContent = 'Show';
    }
  });

  $('auth-switch-btn').addEventListener('click', () => {
    isSignupMode = !isSignupMode;
    hideAuthError();
    if(isSignupMode){
      $('auth-tag').textContent = 'Create an account to get started';
      $('auth-submit').textContent = 'Create account';
      $('auth-switch-text').textContent = 'Already have an account?';
      $('auth-switch-btn').textContent = 'Sign in';
    } else {
      $('auth-tag').textContent = 'Sign in to sync your tasks everywhere';
      $('auth-submit').textContent = 'Sign in';
      $('auth-switch-text').textContent = "Don't have an account?";
      $('auth-switch-btn').textContent = 'Create one';
    }
  });

  $('auth-submit').addEventListener('click', () => {
    hideAuthError();
    const email = $('auth-email').value.trim();
    const password = $('auth-password').value;
    if(!email || !password){
      showAuthError('Enter both email and password.');
      return;
    }
    if(password.length < 6){
      showAuthError('Password must be at least 6 characters.');
      return;
    }
    $('auth-submit').disabled = true;
    const action = isSignupMode
      ? auth.createUserWithEmailAndPassword(email, password)
      : auth.signInWithEmailAndPassword(email, password);
    action.catch((err) => {
      showAuthError(friendlyAuthError(err.code));
    }).finally(() => {
      $('auth-submit').disabled = false;
    });
  });

  function friendlyAuthError(code){
    const map = {
      'auth/email-already-in-use': 'This email is already registered. Try signing in instead.',
      'auth/invalid-email': 'That email address looks invalid.',
      'auth/user-not-found': 'No account found with this email.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/weak-password': 'Password is too weak — use at least 6 characters.',
      'auth/invalid-credential': 'Incorrect email or password.'
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  $('logout-btn').addEventListener('click', () => {
    auth.signOut();
  });

  auth.onAuthStateChanged((user) => {
    $('auth-loading').style.display = 'none';
    if(user){
      currentUser = user;
      $('auth-screen').style.display = 'none';
      $('app').classList.add('show');
      attachTaskListener();
    } else {
      currentUser = null;
      if(unsubscribe) unsubscribe();
      tasks = [];
      loaded = false;
      $('app').classList.remove('show');
      $('auth-screen').style.display = 'flex';
    }
  });

  // network status indicator
  function updateSyncBox(){
    const box = $('sync-box');
    if(navigator.onLine){
      box.innerHTML = '<span class="sync-dot"></span>Synced';
    } else {
      box.innerHTML = '<span class="sync-dot offline"></span>Offline — will sync later';
    }
  }
  window.addEventListener('online', updateSyncBox);
  window.addEventListener('offline', updateSyncBox);

  // ---------------- TASKS (Firestore) ----------------
  function tasksCollection(){
    return db.collection('users').doc(currentUser.uid).collection('tasks');
  }

  function attachTaskListener(){
    updateSyncBox();
    unsubscribe = tasksCollection().onSnapshot((snapshot) => {
      tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      loaded = true;
      render();
    }, (err) => {
      console.error('Sync error:', err);
    });
  }

  function addTask(){
    const titleEl = $('input-title');
    const title = titleEl.value.trim();
    if(!title) return;
    const priority = $('input-priority').value;
    const due = $('input-date').value || todayStr();
    tasksCollection().add({
      title,
      priority,
      due,
      done: false,
      createdAt: Date.now(),
      completedAt: null
    });
    titleEl.value = '';
    $('input-date').value = '';
  }

  function toggleTask(id){
    const t = tasks.find(x => x.id === id);
    if(!t) return;
    tasksCollection().doc(id).update({
      done: !t.done,
      completedAt: !t.done ? Date.now() : null
    });
  }

  function deleteTask(id){
    tasksCollection().doc(id).delete();
  }

  function setView(view){
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.view === view);
    });
    render();
  }

  function priorityRank(p){ return p === 'high' ? 0 : p === 'med' ? 1 : 2; }

  function getFiltered(){
    const today = todayStr();
    let list;
    if(currentView === 'today'){
      list = tasks.filter(t => !t.done && t.due <= today);
    } else if(currentView === 'upcoming'){
      list = tasks.filter(t => !t.done && t.due > today);
    } else if(currentView === 'completed'){
      list = tasks.filter(t => t.done);
    } else {
      list = tasks.filter(t => !t.done);
    }
    return list.sort((a,b) => {
      if(a.due !== b.due) return a.due.localeCompare(b.due);
      return priorityRank(a.priority) - priorityRank(b.priority);
    });
  }

  function fmtDate(dstr){
    const [y,m,d] = dstr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  }

  function renderTaskRow(t){
    const today = todayStr();
    const overdue = !t.done && t.due < today;
    const priorityLabel = t.priority === 'high' ? 'High' : t.priority === 'med' ? 'Medium' : 'Low';
    return `
      <div class="task" data-id="${t.id}">
        <div class="check ${t.done ? 'done' : ''}" data-action="toggle"></div>
        <div class="task-body">
          <div class="task-title ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
          <div class="task-meta">
            <span class="pill ${t.priority}">${priorityLabel}</span>
            <span class="${overdue ? 'due-overdue' : ''}">${overdue ? 'Overdue · ' : ''}${fmtDate(t.due)}</span>
          </div>
        </div>
        <button class="del-btn" data-action="delete" aria-label="Delete task">×</button>
      </div>
    `;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render(){
    if(!loaded) return;
    const today = todayStr();

    $('count-today').textContent = tasks.filter(t => !t.done && t.due <= today).length;
    $('count-upcoming').textContent = tasks.filter(t => !t.done && t.due > today).length;
    $('count-all').textContent = tasks.filter(t => !t.done).length;
    $('count-completed').textContent = tasks.filter(t => t.done).length;

    $('stat-total').textContent = tasks.length;
    $('stat-overdue').textContent = tasks.filter(t => !t.done && t.due < today).length;
    $('stat-pending').textContent = tasks.filter(t => !t.done).length;
    $('stat-done').textContent = tasks.filter(t => t.done).length;

    const completedToday = tasks.filter(t => {
      if(!t.done || !t.completedAt) return false;
      const cd = new Date(t.completedAt);
      const cstr = cd.getFullYear() + '-' + String(cd.getMonth()+1).padStart(2,'0') + '-' + String(cd.getDate()).padStart(2,'0');
      return cstr === today;
    }).length;
    $('streak-num').textContent = completedToday;

    const titles = { today:'Today', upcoming:'Upcoming', all:'All tasks', completed:'Completed' };
    $('view-title').textContent = titles[currentView];
    $('view-date').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

    $('progress-text').textContent = tasks.length
      ? `${tasks.filter(t=>t.done).length} of ${tasks.length} done`
      : 'No tasks yet';

    const list = getFiltered();
    const container = $('task-container');
    if(list.length === 0){
      const emptyMsgs = {
        today: ['Nothing due today', 'Add a task above to get started.'],
        upcoming: ['No upcoming tasks', 'Tasks with a future date will show here.'],
        all: ["You're all caught up", 'Add a task above to begin.'],
        completed: ['Nothing completed yet', 'Finished tasks will show up here.']
      };
      const [t1,t2] = emptyMsgs[currentView];
      container.innerHTML = `<div class="task-list"><div class="empty-state"><div class="empty-state-title">${t1}</div>${t2}</div></div>`;
      return;
    }

    if(currentView === 'completed' || currentView === 'today'){
      container.innerHTML = `<div class="task-list">${list.map(renderTaskRow).join('')}</div>`;
    } else {
      const groups = {};
      list.forEach(t => {
        const key = t.due;
        if(!groups[key]) groups[key] = [];
        groups[key].push(t);
      });
      const keys = Object.keys(groups).sort();
      container.innerHTML = keys.map(k => `
        <div class="group-label">${fmtDate(k)}</div>
        <div class="task-list">${groups[k].map(renderTaskRow).join('')}</div>
      `).join('');
    }
  }

  document.addEventListener('click', (e) => {
    const navItem = e.target.closest('.nav-item');
    if(navItem){ setView(navItem.dataset.view); return; }

    const taskEl = e.target.closest('.task');
    if(!taskEl) return;
    const id = taskEl.dataset.id;
    const action = e.target.dataset.action;
    if(action === 'toggle') toggleTask(id);
    if(action === 'delete') deleteTask(id);
  });

  $('add-btn').addEventListener('click', addTask);
  $('input-title').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addTask();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  // ---------------- INSTALL PROMPT ----------------
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    $('install-btn').style.display = 'inline-block';
  });

  $('install-btn').addEventListener('click', async () => {
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    $('install-btn').style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    $('install-btn').style.display = 'none';
  });
})();
</script>

</body>
</html>
